[package]
name = "zip-unlocker"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1"
num_cpus = "1.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
